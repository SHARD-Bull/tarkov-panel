<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarkov – Panel de progreso</title>
<style>
:root{
  --bg:#12161b; --panel:#191f26; --panel2:#212932; --line:#2c3743; --txt:#dae1e8; --mute:#8896a6;
  --acc:#82a8c8; --acc2:#a3c2dc; --ok:#82c4a0; --warn:#e0884a; --bad:#d98279; --link:#9dbcd6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:var(--link)}
header{position:sticky;top:0;z-index:20;background:#0b0d10;border-bottom:2px solid var(--acc);padding:10px 16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;color:var(--acc);letter-spacing:.5px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
nav button.on{background:var(--acc);color:#101a24;font-weight:700;border-color:var(--acc)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acc)}
#status{font-size:12.5px;color:var(--mute);margin-top:6px}
#status.err{color:var(--bad)} #status.warn{color:var(--warn)}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
main.wide{max-width:none;padding:10px 12px 14px}
main.wide .chips{flex-wrap:wrap;overflow:visible}
.tree-wrap{cursor:grab}.tree-wrap.drag{cursor:grabbing;user-select:none}
.node:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--tc,#888)}
.node.dim2{opacity:.28}
.node.kappa{background:linear-gradient(180deg,#2d2a1d,#242219);box-shadow:0 0 0 1px #c9b06a66,0 2px 8px #0008}
.node.kappa.st-lock{opacity:.85}
.node.kappa.st-done{background:linear-gradient(180deg,#2a2a1c,#212016)}
.node.kappa:after{content:"KAPPA";position:absolute;top:-8px;right:14px;background:#c9b06a;color:#101a24;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;letter-spacing:.6px}
.node.kappa.dim2{opacity:.28}
.lg.kap{border-color:#c9b06a;background:#2d2a1d}
.node.found{outline:3px solid var(--acc2);outline-offset:3px;animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{outline-color:transparent}}
.edges path{stroke:var(--c,#394653);opacity:.55}
.edges path.faded{opacity:.12}
.edges path.hl{opacity:1;stroke-width:3.4}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:8px;margin-bottom:12px}
.controls label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
input[type=search],input[type=number],select{background:#090d11;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px}
input[type=search]{min-width:200px;flex:1}
input[type=number]{width:70px}
.sum{color:var(--mute);font-size:13px;margin:6px 2px 12px}
details.grp{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
details.grp>summary{cursor:pointer;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:before{content:"▸";color:var(--acc)} details.grp[open]>summary:before{content:"▾"}
.pbar{flex:1;height:6px;background:#090b0e;border-radius:3px;overflow:hidden;max-width:220px}
.pbar i{display:block;height:100%;background:var(--ok)}
.cnt{color:var(--mute);font-weight:400;font-size:13px}
ul.list{list-style:none;margin:0;padding:0 12px 10px}
.task{padding:8px 0;border-top:1px solid var(--line)}
.task.done .name{text-decoration:line-through;color:var(--mute)}
.task .row1{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;flex:1;min-width:220px}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--ok);flex:none}
.name{font-weight:600}
.sub{margin:3px 0 0 26px;font-size:12.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sub button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:4px;padding:1px 6px;cursor:pointer;font-size:12px}
.sub button:hover{color:var(--acc2);border-color:var(--acc)}
.b{font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.b.kappa{color:#e8c46a;border-color:#8a7330}
.b.ok{color:var(--ok);border-color:#364d64}
.b.warn{color:var(--warn);border-color:#8a4f25}
.b.fir{color:#e08a8a;border-color:#8a3a3a}
.ltw{overflow-x:auto}.ltab{width:100%;border-collapse:collapse}.ltab th,.ltab td{padding:9px 8px;border-top:1px solid var(--line);text-align:left;font-size:13.5px;vertical-align:middle}.ltab th{color:var(--mute);font-weight:500;font-size:12px;border-top:0}.ltab.sm td{padding:5px 4px;font-size:13px}.ltr{cursor:pointer}.ltr:hover{background:var(--p2)}.ltr.own{opacity:.6}.pn{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:12.5px}.pn.p{background:#1f3a2c;color:var(--ok)}.pn.n{background:#40231f;color:var(--bad)}
.fwrap{display:flex;flex-direction:column;gap:14px}.ftop{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.fcard h4{margin:0 0 6px;font-size:15px;color:var(--acc2)}.fcard p{margin:0 0 10px;font-size:13px;line-height:1.5}
.fl{display:block;color:var(--mute);font-size:12.5px;margin:6px 0}.fl input,.fcard textarea{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font:inherit}.fcard textarea{resize:vertical;font-family:ui-monospace,monospace;font-size:12px;margin:6px 0}
.frb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn.pri{background:#26394b;border-color:var(--acc);color:var(--txt)}.btn.bad{color:var(--bad)}
.fbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.fbar select{margin-left:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.fcol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--ok)}.fcol.theirs{border-top-color:var(--acc)}
.fch{display:flex;align-items:center;gap:10px;margin-bottom:6px}.fch h3{margin:0;font-size:15px;flex:1}.fpill{background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-weight:700;color:var(--acc2)}
.fg{margin-top:12px}.fgt{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:4px}.fgt i{width:9px;height:9px;border-radius:50%;display:inline-block}.fgt small{margin-left:auto;color:var(--mute)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}.frn b{font-weight:600}.frn small{display:block;color:var(--mute);font-size:12px;margin-top:1px}.kp{color:#c9b27a}
.fempty,.fhint{color:var(--mute);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-size:13.5px}
@media(max-width:900px){.ftop,.fgrid{grid-template-columns:1fr}}
.nfl{position:absolute;right:38px;bottom:4px;background:#0007;border:1px solid #48535e;color:#8896a6;border-radius:6px;font-size:12px;line-height:1;padding:3px 7px;cursor:pointer;z-index:2}.nfl:hover{border-color:var(--bad);color:var(--txt)}.nfl.on{background:#5a2b27;color:#ffd9d4;border-color:var(--bad)}
.node.failed{border-color:#7b3f3a!important;background:linear-gradient(180deg,#2a1f20,#1a1516)!important}.node.failed .av{border-color:var(--bad)!important}.node.failed .nt{text-decoration:line-through;color:#b58a86!important}
.lg.fail{border-color:var(--bad);background:#2a1f20}.b.bad{color:var(--bad);border-color:#7b3f3a}
.prow .pst{display:flex;gap:6px;margin-top:6px}.prow.failed{opacity:.6;border-color:#7b3f3a}.btn.sm.bad.on{background:#5a2b27;border-color:var(--bad);color:#ffd9d4}
.bkbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 16px 0;padding:10px 14px;background:#1c2530;border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;font-size:13px}.bkbar b{display:block;margin-bottom:2px}.bkbar span{color:var(--mute)}.bkb{display:flex;gap:8px;flex-wrap:wrap}
.gmems{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.gm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.gm.me{border-color:var(--acc)}.gmt{display:flex;justify-content:space-between;gap:8px;font-size:13px}.gmt span{color:var(--mute)}.gbar{height:6px;border-radius:4px;background:#0c1014;margin-top:7px;overflow:hidden}.gbar i{display:block;height:100%;background:linear-gradient(90deg,#5d7f9f,var(--ok))}
.gfl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.gfl select{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.fcol.grp{border-top-color:var(--acc)}.grow{align-items:flex-start}.gchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.gch{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}.gch.y{background:#1f3a2c;color:var(--ok);border-color:#2f5a44}.gch.me{font-weight:700}
@media (max-width:700px){
 header{position:static;padding:8px 10px}h1{font-size:15px}h1 small{display:block;margin-top:2px}
 .tools{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.tools>*{flex:none}
 nav{flex-wrap:nowrap;overflow-x:auto;gap:4px;padding-bottom:4px}nav button{flex:none;white-space:nowrap;padding:7px 11px;font-size:13px}
 #app{padding-left:8px;padding-right:8px}.bkbar{margin:8px 8px 0}
 .iseg{display:flex;max-width:100%;overflow-x:auto}.iseg button{flex:none;white-space:nowrap;padding:6px 10px}
 .controls{gap:8px}.controls select,.controls input[type=search],.controls input[type=text]{max-width:100%;min-width:0}.controls input[type=search]{width:100%}
 input,select,textarea{font-size:16px}
 .gcard{padding-top:28px}#pmap{height:340px}.node{touch-action:manipulation}
 .btn{padding:8px 11px}.fbar{gap:8px}.fbar select{max-width:100%}
 .kgrid{grid-template-columns:1fr}.hgrid{grid-template-columns:1fr}
 .ikpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.b.key{color:#b79be8;border-color:#5d4a8a}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.item.done{opacity:.55}
.item img,.ph{width:44px;height:44px;object-fit:contain;background:#090b0e;border-radius:6px}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:11px}
.item .nm{font-weight:600}
.item .meta{font-size:12.5px;color:var(--mute);margin-top:2px}
.item .prices{font-size:12.5px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.pr b{color:var(--acc2)} .pr .cheap{color:var(--ok)}
.right{text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.need{font-size:13px}
.need strong{font-size:17px;color:var(--acc2)}
.ctr{display:inline-flex;gap:3px;align-items:center}
.ctr button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:16px}
.ctr button:hover{border-color:var(--acc)}
.ctr input{width:58px;text-align:center}
details.uses{margin-top:4px;font-size:12.5px;color:var(--mute)}
details.uses summary{cursor:pointer}
details.uses ul{margin:4px 0 0 16px;padding:0}
.station{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.station>h3{margin:0;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:16px;border-bottom:1px solid var(--line)}
.station>h3 .sp{flex:1}
.lvl{padding:8px 12px;border-top:1px solid var(--line)}
.lvl:first-of-type{border-top:0}
.lvl.done{opacity:.5}
.lvl .reqs{margin:6px 0 0 26px;font-size:13px}
.lvl .reqs div{padding:2px 0}
.msg{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);padding:14px;border-radius:8px}
.msg h2{margin:0 0 6px;font-size:16px}
.note{font-size:12.5px;color:var(--mute);margin:10px 2px}
footer{max-width:1100px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--mute)}
@media (max-width:640px){.item{grid-template-columns:44px 1fr}.right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;width:100%}}
/* ── Árbol de misiones ── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:4px;scrollbar-width:thin}
.chip{position:relative;flex:none;display:flex;align-items:center;gap:8px;padding:5px 14px 8px 5px;background:linear-gradient(#1c232a,#14181d);border:1px solid var(--line);border-radius:999px;color:var(--txt);cursor:pointer;overflow:hidden;font:inherit}
.chip:hover{border-color:var(--acc2)}
.chip img,.av0{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#090b0e;border:2px solid #38434f;flex:none}
.av0{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc)}
.chip[style*='--tc'] img{border-color:var(--tc)}
.chip.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:linear-gradient(#1c2733,#141b23)}
.chip.on img,.chip.on .av0{border-color:var(--acc)}
.chip .cn{font-weight:650;font-size:14px;white-space:nowrap}
.chip .cc{font-size:12px;color:var(--mute)}
.chip i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);transition:width .3s}
.tree-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 1px 1px,#20272e 1px,transparent 0) 0 0/24px 24px,#0c0f12;padding:20px;min-height:280px}
.tree-sizer{position:relative}
.tree{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edges path{fill:none;stroke-width:2.2}
.edges path.done{stroke:#537599;opacity:.9}
.edges path.go{stroke:var(--acc);opacity:1}
.edges path.virt{stroke-dasharray:7 5}
.node{position:absolute;width:300px;height:88px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;background:linear-gradient(180deg,#1f262d,#15191e);border:1px solid #35414d;border-radius:12px;cursor:pointer;box-shadow:0 3px 10px #0009;transition:border-color .15s,transform .15s,opacity .15s}
.node:hover{border-color:var(--acc2);transform:translateY(-1px)}
.node .av{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#090b0e;border:2px solid #38434f;flex:none}
.node .nb{min-width:0;flex:1}
.node .nt{font-weight:700;font-size:14px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .nm{font-size:11.5px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warnTxt{color:var(--warn)} .kap{color:#e8c46a}
.node.st-lock{opacity:.6}
.node.st-avail{border-color:var(--acc);box-shadow:0 0 0 1px #82a8c866,0 3px 12px #000a}
.node.st-avail .av{border-color:var(--acc)}
.node.st-done{border-color:#44607d;background:linear-gradient(180deg,#202932,#171b20)}
.node.st-done .av{border-color:var(--ok);filter:saturate(.6) brightness(.85)}
.node.st-done .nt{text-decoration:line-through;color:var(--mute)}
.node.sel{outline:2px solid var(--link);outline-offset:2px}
.node.dim{opacity:.15}
.nchk{flex:none;display:flex;padding:6px;cursor:pointer}
.nchk input{width:20px;height:20px;accent-color:var(--ok);cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin:10px 2px}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid #35414d;vertical-align:-1px}
.lg.avail{border-color:var(--acc)} .lg.done{border-color:var(--ok);background:#202932} .lg.lock{opacity:.5}
#zoomwrap{display:flex;align-items:center;gap:6px}
#zoom{width:110px;accent-color:var(--acc)}
/* ── Detalle de misión ── */
#scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(450px,100vw);background:#12161a;border-left:2px solid var(--acc);box-shadow:-10px 0 30px #000b;transform:translateX(105%);transition:transform .22s;z-index:50;overflow-y:auto;padding:16px 18px 40px}
#drawer.open{transform:none}
.dh{display:flex;gap:12px;align-items:flex-start;position:relative;padding-right:34px}
.dh img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:2px solid var(--acc);flex:none}
.dh h2{margin:2px 0 6px;font-size:19px;line-height:1.2}
.dtr{font-size:12px;color:var(--acc2);letter-spacing:.8px;text-transform:uppercase}
.dmeta{display:flex;gap:6px;flex-wrap:wrap}
.dh .x{position:absolute;right:0;top:0;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:20px;cursor:pointer}
.dbtns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn.big{padding:9px 14px;font-size:14px}
.btn.prim{background:var(--acc);color:#101a24;border-color:var(--acc);font-weight:700}
.btn.sm{padding:3px 8px;font-size:12px;margin-left:8px;vertical-align:middle}
a.btn{text-decoration:none;color:var(--txt);display:inline-flex;align-items:center}
#drawer h3{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--acc2);margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.obj{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;line-height:1.35}
.obj:hover{background:#ffffff08}
.obj input{width:18px;height:18px;margin-top:2px;accent-color:var(--ok);flex:none}
.obj.on span{color:var(--mute);text-decoration:line-through}
.dl{margin:0;padding-left:18px} .dl li{padding:2px 0}
.lk{background:none;border:0;color:var(--link);cursor:pointer;padding:0;font:inherit;text-align:left;text-decoration:underline}
.lk.ok{color:var(--ok)}
.fm{display:flex;flex-direction:column;gap:10px;margin-top:10px}.fm label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.fm input[type=text],.fm textarea{background:#090d11;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.pane{overflow:auto;container-type:inline-size;padding-right:6px;scrollbar-width:thin}
.ph2{position:sticky;top:0;z-index:5;margin:0 0 6px;padding:8px 2px;font-size:18px;background:var(--bg,#0d1013);border-bottom:2px solid var(--acc)}
.ph2 small{font-size:12px;color:var(--mute);font-weight:400;margin-left:8px}
@container (max-width:640px){.item{grid-template-columns:44px 1fr}.item .right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;width:100%}}
@media (max-width:900px){.split{grid-template-columns:1fr}}
/* ── Gunsmith ── */

const JSON_BASE = 'https://json.tarkov.dev/';
async function getJson(name){
  const url = JSON_BASE + (S.mode === 'pve' ? 'pve' : 'regular') + '/' + name;
  let err;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      return j.data !== undefined ? j.data : j;
    } catch(e) { err = e; await new Promise(res => setTimeout(res, 700 * (i + 1))); }
  }
  throw new Error(tx('No se pudo descargar «', 'Could not download “') + name + tx('» (', '” (') + ((err && err.message) || tx('sin respuesta', 'no response')) + ')');
}

function priceFromItem(it){
  let buy = null, sell = null;
  for (const b of it.buyFromTrader || []) {
    if (!b || b.priceRUB == null) continue;
    if (!buy || b.priceRUB < buy.p) buy = { p: b.priceRUB, t: b.trader, l: b.minTraderLevel || 0 };
  }
  for (const s of it.sellToTrader || []) {
    if (!s || s.priceRUB == null) continue;
    if (!sell || s.priceRUB > sell.p) sell = { p: s.priceRUB, t: s.trader };
  }
  return { flea: it.lastLowPrice || null, avg: it.avg24hPrice || null, buy, sell };
}
function buildPrices(allItems, regItems){
  const byId = {};
  Object.values(regItems).forEach(i => { if (!i.special && allItems[i.rawId]) byId[i.id] = priceFromItem(allItems[i.rawId]); });
  return { ts: Date.now(), byId };
}

  ['Zona cero', 'Ground Zero'], ['Ojo del Mundo', 'The Eye of the World'], ['Los Inauditos', 'The Unheard'], ['Peón negro', 'Black Pawn'], ['Peón blanco', 'White Pawn'], ['Balneario', 'Health Resort'], ['Refugio', 'Hideout'], ['Dormitorios', 'Dorms'], ['dormitorios', 'Dorms'], ['aserradero', 'Sawmill'],
  ['Aduanas', 'Customs'], ['Bosque', 'Woods'], ['Costa', 'Shoreline'], ['Reserva', 'Reserve'], ['Faro', 'Lighthouse'], ['Intercambio', 'Interchange'], ['Fábrica', 'Factory'], ['Laboratorio', 'The Lab'], ['Laberinto', 'The Labyrinth'], ['Rompehielos', 'Icebreaker']];
let PLRE = null, PLSRC = null;
const PL_EMPTY = { pl: [] };
function plApply(s, d){
  if (!s) return s; d = d || D; const src = (d && d.pl) || [];
  if (PLSRC !== src) { PLSRC = src; PLRE = src.concat(PL_CUR).filter(p => p[0] && p[1] && p[0] !== p[1]).sort((a, b) => b[0].length - a[0].length)
    .map(p => [new RegExp('(?<![\\p{L}\\d])' + p[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\d])', 'gu'), p[1]]); }
  let r = s; PLRE.forEach(([re, en]) => { r = r.replace(re, en); }); return r;
}
function applyLang(d){
  const en = S.lang === 'en', pick = (a, b) => en ? (b || a) : (a || b);
  d.tasks.forEach(t => { if (t.custom) return;
    t.name = pick(t.nameEs, t.en); t.trader.name = pick(t.trader.nameEs, t.trader.nameEn); t.map = t.mapEn || t.mapEs;
    t.obj.forEach(o => { o.x = en ? (o.xEn || o.xEs) : plApply(o.xEs || o.xEn, d); }); });
  Object.values(d.items).forEach(i => { i.name = i.key ? (i.nameEn || i.nameEs) : pick(i.nameEs, i.nameEn); i.short = i.key ? (i.shortEn || i.shortEs) : pick(i.shortEs, i.shortEn); i.sq = norm([i.nameEs, i.nameEn, i.shortEs, i.shortEn].join(' ')); });
  d.hideout.forEach(s => { s.name = pick(s.nameEs, s.nameEn); s.sq = norm(s.nameEs + ' ' + s.nameEn); s.levels.forEach(l => l.skills.forEach(k => { k.name = pick(k.nameEs, k.nameEn); })); });
  Object.values(d.gun || {}).forEach(g => g.builds.forEach(b => { b.cats = (en ? b.catsEn : b.catsEs) || []; }));
  Object.values(d.traders || {}).forEach(t => { t.name = pick(t.nameEs, t.nameEn); });
}

function customTasks(d){
  d.tasks = d.tasks.filter(t => !t.custom);
  (S.custom || []).forEach(c => {
    const tr = (d.traders || {})[c.trader] || {};
    d.tasks.push({ id: c.id, custom: true, name: c.name, nameEs: c.name, en: c.en || '', wiki: c.en ? 'https://escapefromtarkov.fandom.com/wiki/' + encodeURIComponent(c.en.replace(/ /g, '_')) : '', lvl: c.lvl || 0, kappa: false, pts: [], mps: [],
      trader: { id: tr.id || '', name: tr.name || c.traderName || c.trader, key: c.trader }, map: c.map || '', req: c.req || [], obj: (c.obj || []).map((x, i) => ({ id: c.id + 'o' + i, x: (S.lang === 'en' && c.objEn && c.objEn[i]) || x, op: false })) });
  });
}
function computeOrder(d){
  applyLang(d); customTasks(d);
  // Orden en cadena por comerciante: cada misión después de sus requisitos; empates por nivel y nombre.
  const groups = new Map();
  d.tasks.forEach(t => { if (!groups.has(t.trader.key)) groups.set(t.trader.key, { key: t.trader.key, name: t.trader.name, tasks: [] }); groups.get(t.trader.key).tasks.push(t); });
  const arr = [...groups.values()];
  arr.forEach(g => {
    const ids = new Set(g.tasks.map(t => t.id)); const placed = new Set(); const out = []; let left = g.tasks.slice();
    while (left.length) {
      const ready = left.filter(t => t.req.every(r => !ids.has(r) || placed.has(r)));
      const pool = ready.length ? ready : left;
      pool.sort((a,b) => a.lvl - b.lvl || a.name.localeCompare(b.name, LOC()));
      const t = pool[0]; out.push(t); placed.add(t.id); left = left.filter(x => x !== t);
    }
    g.tasks = out; g.story = /story|narrador|cuenta/.test(g.key);
  });
  const rank = k => { const i = TRADER_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  arr.sort((a,b) => rank(a.key) - rank(b.key) || a.name.localeCompare(b.name, LOC()));
  d.groups = arr; d.byId = Object.fromEntries(d.tasks.map(t => [t.id, t]));
}

const NW = 300, NH = 88, GX = 70, GY = 14;
let treeKey = '';
const ancestors = (id, acc = new Set()) => { const t = D.byId[id]; if (t) t.req.forEach(r => { if (!acc.has(r) && D.byId[r]) { acc.add(r); ancestors(r, acc); } }); return acc; };
const isDone = id => !!(S.done[id] || (S.fail && S.fail[id]));
const stateOf = t => isDone(t.id) ? 'done' : (t.req.every(r => isDone(r) || !D.byId[r]) ? 'avail' : 'lock');

const TCOL = ['#d89a4a','#4fb3b5','#9a7be0','#5a9be6','#e0cd55','#e0679a','#7ccb62','#e07a5a','#6ad0a8','#b0b0b0'];
let lastL = null;
const trColor = key => { const i = D.groups.findIndex(g => g.key === key); return TCOL[(i < 0 ? 9 : i) % TCOL.length]; };

/* Esquema global: columnas = «profundidad» (cuántas misiones previas encadenadas, de cualquier comerciante). */
/* Cadenas «Parte N»: si una misión se llama «… Parte N» y el juego no la enlaza con la «Parte N-1» (mismo comerciante), se enlaza solo en el dibujo. */
let chainCache = null;
function chainLinks(){
  if (chainCache && chainCache.d === D) return chainCache.m;
  const m = new Map(), grp = new Map();
  D.tasks.forEach(t => {
    const nm = String(t.en || t.name || '').toLowerCase().trim();
    const x = /^(.*?)[\s\-–:]*(?:part|parte)\s*(\d+)\s*$/.exec(nm); if (!x || !x[1]) return;
    const k = t.trader.key + '|' + x[1].replace(/[^a-z0-9]+/g, ' ').trim();
    (grp.get(k) || grp.set(k, []).get(k)).push({ t, n: parseInt(x[2], 10) });
  });
  grp.forEach(a => {
    a.sort((p, q) => p.n - q.n);
    for (let i = 1; i < a.length; i++) {
      if (a[i].n === a[i - 1].n) continue;
      const t = a[i].t, prev = a[i - 1].t;
      if (t.req.includes(prev.id) || ancestors(t.id).has(prev.id)) continue;
      m.set(t.id, prev.id);
    }
  });
  chainCache = { d: D, m }; return m;
}
function layoutAll(tasks){
  const set = new Set(tasks.map(t => t.id)), byId = new Map(tasks.map(t => [t.id, t]));
  const ti = new Map(D.groups.map((g, i) => [g.key, i]));
  const ch = S.chain ? chainLinks() : null;
  const par = t => { const r = t.req.filter(x => set.has(x)); const v = ch && ch.get(t.id); if (v && set.has(v) && !r.includes(v)) r.push(v); return r; };
  const kids = new Map(); tasks.forEach(t => par(t).forEach(p => { (kids.get(p) || kids.set(p, []).get(p)).push(t.id); }));
  const depth = new Map();
  const dfs = (t, stack) => {
    if (depth.has(t.id)) return depth.get(t.id);
    if (stack.has(t.id)) return 0;
    stack.add(t.id);
    const ps = par(t); const d = ps.length ? 1 + Math.max(...ps.map(p => dfs(byId.get(p), stack))) : 0;
    stack.delete(t.id); depth.set(t.id, d); return d;
  };
  tasks.forEach(t => dfs(t, new Set()));
  // Las misiones sin previas se acercan a la primera misión que desbloquean (así no se amontonan todas en la primera columna).
  tasks.forEach(t => { if (!par(t).length && kids.has(t.id)) depth.set(t.id, Math.max(0, Math.min(...kids.get(t.id).map(k => depth.get(k))) - 1)); });
  const ncol = tasks.length ? Math.max(...depth.values()) + 1 : 0;
  const cols = Array.from({ length: ncol }, () => []);
  tasks.forEach(t => cols[depth.get(t.id)].push(t));
  const STEP = NH + GY, y = new Map();
  const base = (a, b) => (ti.get(a.trader.key) ?? 99) - (ti.get(b.trader.key) ?? 99) || a.lvl - b.lvl || a.name.localeCompare(b.name, LOC());
  const pack = (col, want) => { col.sort((a, b) => (want.get(a.id) - want.get(b.id)) || base(a, b)); let cur = -Infinity; col.forEach(t => { const v = Math.max(want.get(t.id), cur); y.set(t.id, v); cur = v + STEP; }); };
  // Orden inicial: columna a columna según la posición media de sus previas.
  cols.forEach((col, ci) => {
    const want = new Map(); let free = 0;
    col.slice().sort(base).forEach(t => { const ps = par(t).map(p => y.get(p)).filter(v => v != null); want.set(t.id, ps.length ? ps.reduce((a, v) => a + v, 0) / ps.length : (free += STEP) - STEP); });
    pack(col, want);
  });
  // Pasadas de ajuste (media de previas y siguientes) para acortar cruces.
  const nb = (t, back) => (back ? par(t) : (kids.get(t.id) || []).map(k => byId.get(k)).filter(Boolean)).map(n => y.get(n.id)).filter(v => v != null);
  for (let it = 0; it < 4; it++) {
    const order = it % 2 ? cols.map((_, i) => i) : cols.map((_, i) => ncol - 1 - i);
    order.forEach(ci => {
      const col = cols[ci], want = new Map();
      col.forEach(t => { const a = nb(t, true).concat(nb(t, false)); want.set(t.id, a.length ? a.reduce((s, v) => s + v, 0) / a.length : y.get(t.id)); });
      pack(col, want);
    });
  }
  const minY = tasks.length ? Math.min(...y.values()) : 0; let maxY = 0;
  const pos = new Map(); tasks.forEach(t => { const yy = y.get(t.id) - minY; pos.set(t.id, { x: depth.get(t.id) * (NW + GX), y: yy }); maxY = Math.max(maxY, yy + NH); });
  const edges = []; tasks.forEach(t => par(t).forEach(p => edges.push([p, t.id, !t.req.includes(p)])));
  return { pos, edges, W: Math.max(NW, ncol * (NW + GX) - GX), H: Math.max(NH, maxY) };
}

    const A = L.pos.get(a), B = L.pos.get(b), x1 = A.x + NW, y1 = A.y + NH / 2, x2 = B.x, y2 = B.y + NH / 2, dx = Math.max(30, Math.min(160, (x2 - x1) / 2));

  }).join('');

/* ───────── Historia ───────── */
const sKey = (c, si, oi) => c.id + ':' + si + ':' + oi;
function chProg(c){
  let d = 0, tot = 0, od = 0, ot = 0;
  stSteps(c).forEach((st, si) => st.slice(1).forEach((o, oi) => { const on = !!S.sobj[sKey(c, si, oi)];
    if (o.endsWith('*')) { ot++; if (on) od++; } else { tot++; if (on) d++; } }));
  return { d, tot, od, ot };
}
function storyProgress(){ return STORY.reduce((a, c) => { const p = chProg(c); a.d += p.d; a.tot += p.tot; return a; }, { d: 0, tot: 0 }); }
function chaptersHtml(){
  return `<div class="chgrid">` + STORY.map((c, i) => { const p = chProg(c), pct = p.tot ? Math.round(p.d * 100 / p.tot) : 0;
    return `<button class="chcard ${p.tot && p.d >= p.tot ? 'done' : ''}" data-act="chapter" data-id="${c.id}"><span class="chn">${tx('Capítulo', 'Chapter')} ${i + 1}</span><span class="cht">${esc(c.name)}</span>
      <span class="chs">${c.steps.length} ${tx('pasos', 'steps')} · ${p.d}/${p.tot} ${tx('objetivos', 'objectives')}</span><span class="pbar"><i style="width:${pct}%"></i></span></button>`; }).join('')
    + `</div><p class="note">${tx('Los capítulos están en un orden orientativo. Los pasos y objetivos salen de una guía pública (tarkov101.com), traducidos al español: pueden tener pequeñas diferencias con el juego. Los objetivos «opcionales» no cuentan para el progreso.', 'The chapters are in a suggested order. Steps and objectives come from a public guide (tarkov101.com) and may differ slightly from the game. “Optional” objectives do not count towards progress.')}</p>`;
}

    const objs = st.slice(1).map((o, oi) => ({ t: o.endsWith('*') ? o.slice(0, -1) : o, opt: o.endsWith('*'), on: !!S.sobj[sKey(c, si, oi)], oi }));
    const req = objs.filter(o => !o.opt), dn = req.filter(o => o.on).length, allDone = req.length ? dn === req.length : objs.every(o => o.on);

/* ───────── Vista: Hideout ───────── */
function orderedStations(){
  const ids = D.hideout.map(s => s.id);
  let ord = (S.order || []).filter(id => ids.includes(id));
  const rest = D.hideout.filter(s => !ord.includes(s.id)).sort((a, b) => { const ra = STATION_PRIO.indexOf(a.key), rb = STATION_PRIO.indexOf(b.key); return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb); });
  ord = ord.concat(rest.map(s => s.id)); S.order = ord;
  return ord.map(id => D.hideout.find(s => s.id === id));
}

function consumeQuest(id){ (D.reqs[id] || []).forEach(r => { const it = D.items[r.itemId]; if (!it || it.key || it.special || r.type === 'access') return; S.icol[it.id] = Math.max(0, (S.icol[it.id] || 0) - r.count); }); }
function setDone(id, on){ if (on) delete S.fail[id]; if (on && !S.done[id]) { S.done[id] = true; consumeQuest(id); } else if (!on) delete S.done[id]; }
function setFail(id, on){ if (on) { delete S.done[id]; S.fail[id] = true; } else delete S.fail[id]; }
/* Lo que falta por conseguir: solo cuentan los niveles de Hideout sin construir y las misiones sin completar. */
function itemNeeds(){
  const m = new Map();
  const ent = id => { let a = m.get(id); if (!a) { a = { id, item: D.items[id], hide: [], q: [], need: 0, fir: 0, nq: 0 }; m.set(id, a); } return a; };
  orderedStations().forEach(s => s.levels.forEach(l => { if (S.hideout[l.id]) return;
    l.items.forEach(r => { const it = D.items[r.itemId]; if (!it || it.key || it.special) return; const a = ent(r.itemId); a.hide.push({ s, l, n: r.count, fir: r.fir }); a.need += r.count; if (r.fir) a.fir += r.count; }); }));
  D.tasks.forEach(t => { if (isDone(t.id)) return;
    (D.reqs[t.id] || []).forEach(r => { const it = D.items[r.itemId]; if (!it || it.key || it.special || r.type === 'access') return; const a = ent(r.itemId); a.q.push({ t, n: r.count, fir: r.fir, type: r.type }); a.need += r.count; a.nq += r.count; if (r.fir) a.fir += r.count; }); });
  const out = [...m.values()];
  out.forEach(a => { a.have = S.icol[a.id] || 0; a.left = Math.max(0, a.need - a.have); a.done = a.have >= a.need; });
  return out;
}

  const ks = [...new Set(locks.map(x => x[0]).concat(loose.map(x => x[0])))];
  if (!ks.length) return `<div class="kbox"><p class="m">${tx('tarkov.dev no tiene la posición de esta puerta ni puntos de botín para esta llave (puede ser una llave de una zona nueva).', 'tarkov.dev has no position for this door nor loot points for this key (it may belong to a new area).')}</p></div>`;
  if (!ks.includes(KMAP)) KMAP = ks[0];
  const k = KMAP, g = mapGeo(k), pos = (x, z) => { const [u, v] = g.uv(x, z); return `left:${(u * 100).toFixed(2)}%;top:${(v * 100).toFixed(2)}%`; };
  const nl = locks.filter(x => x[0] === k).length, ns = loose.filter(x => x[0] === k).length;
  const dots = loose.filter(x => x[0] === k).map(x => `<i class="pdot loc spawn" style="${pos(x[1], x[2])}" data-act="ppt" data-txt="${esc(tx('Punto de botín suelto donde puede aparecer esta llave', 'Loose-loot point where this key can spawn'))}"></i>`).join('')
    + locks.filter(x => x[0] === k).map(x => `<i class="pdot" style="${pos(x[1], x[2])}" data-act="ppt" data-txt="${esc((x[4] ? tx('Maletero que abre', 'Trunk it opens') : tx('Puerta que abre', 'Door it opens')) + (x[5] ? tx(' (necesita electricidad)', ' (needs power)') : ''))}"></i>`).join('');
  return `${ks.length > 1 ? `<div class="pmaps">${ks.map(x => `<button class="${x === k ? 'on' : ''}" data-act="kmap2" data-id="${x}">${esc(mapName(x))}</button>`).join('')}</div>` : ''}
    <div class="pmapbox"><div id="pmap" data-map="${k}"><div id="pin"><img id="pimg" alt="" src="${svgCache[k] || ''}">${dots}</div></div>
    <div class="pzoom"><button data-act="pzoom" data-d="in">+</button><button data-act="pzoom" data-d="out">−</button><button data-act="pzoom" data-d="reset" title="${tx('Ver todo', 'Fit all')}">⤢</button></div></div>
    <div class="kleg"><span><i class="kdl"></i>${tx('Puerta que abre', 'Door it opens')} (${nl})</span><span><i class="kds"></i>${tx('Puntos de botín donde puede aparecer', 'Loot points where it can spawn')} (${ns})</span><span class="m">${tx('Rueda = zoom · arrastra para moverte · pulsa un punto', 'Wheel = zoom · drag to move · click a dot')}</span></div>
    <div id="plabel"></div><div class="pnote" id="pnote"></div>`;
}

/* ── Texto de la wiki (se descarga al abrir una llave y se guarda en el navegador) ── */
function wikiClean(s){ return s.replace(/<li[^>]*>\s*<gallery[\s\S]*?<\/gallery>\s*<\/li>/gi, '').replace(/<gallery[\s\S]*?<\/gallery>/gi, '').replace(/\{\{[^{}]*\}\}/g, '').replace(/\[\[(?:File|Image):[^\]]*\]\]/gi, '').replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g, '$1').replace(/\[\[([^\]]*)\]\]/g, '$1').replace(/'{2,3}/g, '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim(); }
function wikiSec(w, names){ const m = new RegExp('^==\\s*(?:' + names + ')\\s*==[ \\t]*\\n([\\s\\S]*?)(?=^==[^=]|(?![\\s\\S]))', 'mi').exec(w); return m ? m[1] : ''; }
function parseKeyWiki(w){
  const use = /\|\s*usage\s*=\s*([^\n]*)/i.exec(w);
  const generic = /^(in |inside )?(the )?(jackets?|drawers?|pockets|scavs?|raiders?|bosses|cultists?)\b/i;
  const loc = []; let cur = { h: '', l: [] };
  wikiClean(wikiSec(w, 'Key Locations?|Location|Spawn locations?|Spawn')).split('\n').forEach(line => { const h = /^===\s*(.*?)\s*===$/.exec(line.trim());
    if (h) { if (cur.l.length) loc.push(cur); cur = { h: wikiClean(h[1]), l: [] }; return; }
    const b = /^\*+\s*(.+)$/.exec(line.trim()); if (b && !generic.test(b[1].trim()) && b[1].trim().length > 3) cur.l.push(b[1].trim()); });
  if (cur.l.length) loc.push(cur);
  const bullets = t => wikiClean(t).split('\n').map(x => /^\*+\s*(.+)$/.exec(x.trim())).filter(Boolean).map(x => x[1]);
  return { usage: use ? wikiClean(use[1]) : '', loc: loc.slice(0, 6).map(g => ({ h: g.h, l: g.l.slice(0, 8) })), lock: wikiClean(wikiSec(w, 'Lock Locations?')).split('\n').find(x => x.trim()) || '', behind: bullets(wikiSec(w, 'Behind the Lock|Behind the lock')).slice(0, 8) };
}

function noteEs(n){
  let m;
  if (/^Notes:?$/.test(n)) return '';

  if ((m = n.match(/^This build is based on a standard (.+?) from (\w+) LL(\d)\.?\s*(.*)$/))) return `Esta configuración parte de un «${m[1]}» normal que vende ${m[2]} (nv.${m[3]}).` + (m[4] ? ' ' + m[4] : '');

  if (/^Make sure that the chamber is empty/.test(n)) return 'Asegúrate de que la recámara esté vacía, o el arma pesará demasiado.';
  if (/^The stock has to be folded/.test(n)) return 'La culata tiene que estar plegada.';
  if (/^The magazine needs to be removed/.test(n)) return 'Hay que quitar el cargador.';
  if (/^The bipod has to be taken off/.test(n)) return 'Hay que quitar el bípode.';

  else if (t.id === 'fsel') { S.fsel = t.value; saveState(); renderFriends(); }

  else if (t.id === 'ftr') { S.ftr = t.value; saveState(); renderFriends(); }
  else if (t.id === 'friendFile' && t.files[0]) { const rd = new FileReader(); rd.onload = () => { try { const f = frParse(rd.result), nm = frSave($('#ffn') ? $('#ffn').value : '', f); renderFriends(); const m = $('#fmsg'); if (m) { m.textContent = tx('Cargado: ', 'Loaded: ') + nm + ' (' + f.d.length + ' ' + tx('misiones hechas', 'completed quests') + ')'; m.style.color = 'var(--ok)'; } } catch (err) { const m = $('#fmsg'); if (m) { m.textContent = tx('Ese archivo no es válido.', 'That file is not valid.'); m.style.color = 'var(--bad)'; } } }; rd.readAsText(t.files[0]); t.value = ''; }
  else if (t.id === 'tfilter') { S.tfilter = t.value; saveState(); renderList(); }
  else if (t.id === 'extShow') { S.extShow = t.checked; saveState(); renderList(); }
  else if (t.id === 'extNames') { S.extNames = t.checked; saveState(); renderList(); }
  else if (t.id === 'chain') { S.chain = t.checked; saveState(); treeKey = ''; renderList(); }
  else if (t.id === 'hideLocked') { S.hideLocked = t.checked; saveState(); renderList(); }
  else if (t.id === 'hideDone') { S.hideDone = t.checked; saveState(); renderList(); }
  else if (t.id === 'hideBuilt') { S.hideBuilt = t.checked; saveState(); renderList(); }
  else if (t.id === 'itemFilter') { S.itemFilter = t.value; saveState(); renderList(); }
  else if (t.id === 'hview') { S.hview = t.value; saveState(); renderList(); }
  else if (t.id === 'lvl') { S.level = parseInt(t.value, 10) || 0; saveState(); renderList(); }
  else if (t.id === 'importFile' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const lg = S.lang; S = Object.assign(S, JSON.parse(rd.result)); S.lang = lg; saveState(); renderView(); setStatus(tx('Copia cargada correctamente.', 'Backup loaded successfully.')); } catch(err) { setStatus(tx('El archivo no es una copia válida.', 'The file is not a valid backup.'), 'err'); } };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; renderList(); if (S.view === 'quests' && S.trader !== 'story') { searchIdx = 0; const m = findMatches(); if (m.length) centerOn(m[0].id); } }
  else if (e.target.id === 'zoom') { const w = $('#treewrap'); if (w) zoomAt((parseInt(e.target.value, 10) || 100) / 100, w.clientWidth / 2, w.clientHeight / 2); else S.zoom = (parseInt(e.target.value, 10) || 100) / 100; }
});
(function(){
  let d = null;
  document.addEventListener('pointerdown', e => { const w = e.target.closest && e.target.closest('#treewrap'); if (!w || e.button !== 0 || e.target.closest('.node')) return; d = { w, x: e.clientX, y: e.clientY, sl: w.scrollLeft, st: w.scrollTop, moved: false }; });
  document.addEventListener('pointermove', e => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; if (!d.moved && Math.abs(dx) + Math.abs(dy) < 4) return; d.moved = true; d.w.classList.add('drag'); d.w.scrollLeft = d.sl - dx; d.w.scrollTop = d.st - dy; });
  let pd = null;
  document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('#pmap'); if (!b || e.button !== 0 || e.target.closest('.pdot, .pex')) return; pd = { x: e.clientX, y: e.clientY, ox: PV.x, oy: PV.y }; b.classList.add('drag'); });
  document.addEventListener('pointermove', e => { if (!pd) return; PV.x = pd.ox + e.clientX - pd.x; PV.y = pd.oy + e.clientY - pd.y; applyPV(); });
  const pend = () => { pd = null; const b = $('#pmap'); if (b) b.classList.remove('drag'); };
  document.addEventListener('pointerup', pend); document.addEventListener('pointercancel', pend);
  const pz = (f, mx, my) => { const nz = Math.min(12, Math.max(0.5, PV.z * f)), r = nz / PV.z; PV.x = mx - (mx - PV.x) * r; PV.y = my - (my - PV.y) * r; PV.z = nz; applyPV(); };
  document.addEventListener('wheel', e => { const b = e.target.closest && e.target.closest('#pmap'); if (!b) return; e.preventDefault(); const r = b.getBoundingClientRect(); pz(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  window.__pz = pz;
  const end = () => { if (d) d.w.classList.remove('drag'); d = null; };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('wheel', e => { const w = e.target.closest && e.target.closest('#treewrap'); if (!w || !(e.ctrlKey || e.metaKey)) return; e.preventDefault(); const r = w.getBoundingClientRect(); zoomAt((S.zoom || 1) * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  window.addEventListener('resize', () => { fitHeight(); fitPanes(); fitPlan(); });
})();
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q' && S.view === 'quests' && S.trader !== 'story') { const m = findMatches(); if (m.length) { searchIdx = (searchIdx + 1) % m.length; centerOn(m[searchIdx].id); } return; } if (e.key === 'Escape' && (S.sel || S.adding)) { S.sel = null; S.adding = false; renderList(); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.classList && d.classList.contains('grp')) { S.open[d.dataset.key] = d.open; saveState(); } }, true);

/* ───────── Arranque ───────── */
function statusReady(){
  const w = (D && D.warnings && D.warnings.length) ? tx(' · Avisos: ', ' · Warnings: ') + D.warnings.join(' | ') : '';
  const pAge = P && P.ts ? tx(` · Precios de hace ${Math.max(1, Math.round((Date.now() - P.ts) / 60000))} min`, ` · Prices from ${Math.max(1, Math.round((Date.now() - P.ts) / 60000))} min ago`) : '';
  setStatus(tx(`${D.tasks.length} misiones · ${D.hideout.length} estaciones · ${Object.keys(D.items).length} objetos${pAge}${w}`, `${D.tasks.length} quests · ${D.hideout.length} stations · ${Object.keys(D.items).length} items${pAge}${w}`), w ? 'warn' : '');
}
async function boot(force){
  try {
    await loadData(force);
    renderView(); statusReady();
    await loadPrices(force); statusReady(); renderList();
  } catch(e) {
    clearTimeout(window.__retry); window.__retry = setTimeout(() => boot(false), 60000);
    $('#app').innerHTML = `<div class="msg"><h2>${tx('No se pudieron descargar los datos', 'The data could not be downloaded')}</h2>
      <p>${tx('Motivo', 'Reason')}: ${esc(e.message)}</p><p>${tx('Comprueba que tienes conexión a internet y que ningún bloqueador de anuncios o antivirus bloquea <b>json.tarkov.dev</b>. La página lo vuelve a intentar sola cada minuto, o pulsa «Actualizar datos».', 'Check that you are online and that no ad blocker or antivirus is blocking <b>json.tarkov.dev</b>. The page retries by itself every minute, or click “Refresh data”.')}</p>
      <p><b>${tx('Diagnóstico', 'Diagnostics')}</b> ${tx('(si sigue fallando, hazme una captura de esto):', '(if it keeps failing, take a screenshot of this):')}</p><pre id="diag" style="white-space:pre-wrap;font-size:12.5px;color:var(--mute)">${tx('Comprobando…', 'Checking…')}</pre></div>`;
    setStatus(tx('Error de conexión con tarkov.dev', 'Connection error with tarkov.dev'), 'err');
    diagnose().then(t => { const p = $('#diag'); if (p) p.textContent = t; });
  }
}
function updBackup(){
  const el = $('#bkbar'); if (!el) return;
  const now = Date.now(), DAY = 864e5, n = Object.keys(S.done || {}).length + Object.keys(S.hideout || {}).length + Object.keys(S.icol || {}).length;
  if (!S.firstUse) { S.firstUse = now; saveState(); }
  const ref = S.lastBackup || S.firstUse, days = Math.floor((now - ref) / DAY);
  if (n < 5 || days < 14 || now < (S.bkSnooze || 0)) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="bkbar"><div><b>💾 ${S.lastBackup ? tx('Hace ' + days + ' días que no guardas una copia de seguridad.', days + ' days since your last backup.') : tx('Todavía no has guardado ninguna copia de seguridad.', 'You have not saved a backup yet.')}</b>
    <span>${tx('Tu progreso solo está en este navegador: si lo limpias o cambias de ordenador, se pierde. El botón descarga un archivo que luego puedes cargar con «Cargar copia».', 'Your progress only lives in this browser: if you clear it or switch computers it is lost. The button downloads a file you can later load with “Load backup”.')}</span></div>
    <div class="bkb"><button class="btn pri" data-act="export">${tx('Guardar copia ahora', 'Save backup now')}</button><button class="btn" data-act="bkdismiss">${tx('Recordármelo en 3 días', 'Remind me in 3 days')}</button></div></div>`;
}
function updTabs(){ const fe = $('#tabs [data-view=friends]'); if (fe) fe.textContent = '👥 ' + tx('Amigos', 'Friends'); const n = D ? D.tasks.filter(t => S.plan[t.id]).length : Object.keys(S.plan || {}).length; const e = $('#tabs [data-view=plan]'); if (e) e.textContent = '⚑ ' + tx('Mi plan', 'My plan') + ' (' + n + ')'; }
function applyStatic(){
  document.documentElement.lang = S.lang;
  document.title = tx('Tarkov – Panel de progreso', 'Tarkov – Progress panel');
  $('#ttl').textContent = tx('⌖ TARKOV · Panel de progreso', '⌖ TARKOV · Progress panel');
  $('#ver').textContent = tx('versión 24 · Series encadenadas', 'version 24 · Chained series');
  $('#lang').value = S.lang; $('#lang').title = 'Idioma / Language';
  $('#mode').title = tx('Modo de juego', 'Game mode');
  $('#mode').options[0].textContent = tx('Modo PVE', 'PVE mode'); $('#mode').options[1].textContent = tx('Modo PVP', 'PVP mode');
  const set = (sel, t) => { const e = $(sel); if (e) e.textContent = t; };
  set('[data-act=reload]', tx('Actualizar datos', 'Refresh data')); set('[data-act=prices]', tx('Actualizar precios', 'Refresh prices'));
  set('[data-act=export]', tx('Guardar copia', 'Save backup')); set('[data-act=import]', tx('Cargar copia', 'Load backup'));
  set('#tabs [data-view=quests]', tx('Misiones', 'Quests')); updTabs(); set('#tabs [data-view=gun]', 'Gunsmith');
  set('#tabs [data-view=both]', tx('Items, llaves y Hideout', 'Items, keys & Hideout')); set('#tabs [data-view=trade]', tx('Tradeos', 'Barters'));
  $('#drawer').setAttribute('aria-label', tx('Detalle de la misión', 'Quest details'));
  $('#foot').innerHTML = tx('Datos y precios', 'Data and prices') + ': <a href="https://tarkov.dev" target="_blank" rel="noopener">tarkov.dev</a> · ' + tx('Enlaces', 'Links') + ': <a href="https://escapefromtarkov.fandom.com/wiki/Escape_from_Tarkov_Wiki" target="_blank" rel="noopener">Tarkov Wiki</a>. ' + tx('Tu progreso se guarda solo en este navegador.', 'Your progress is saved only in this browser.');
}
loadState();
if ($('#mode')) $('#mode').value = S.mode;
applyStatic(); setStatus(tx('Cargando…', 'Loading…'));
boot(false);
})();
</script>
